server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;
    location / { try_files $uri $uri.html $uri/ =404; }
    location /pdfjs/ {
        types {
            application/javascript mjs;
            application/wasm wasm;
        }
        try_files $uri =404;
    }
    add_header X-Content-Type-Options nosniff always;
    error_page 404 /404.html;
}
